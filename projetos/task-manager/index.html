<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Task Manager</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <main class="app">
    <header class="header">
      <h1>Task Manager</h1>
      <p class="subtitle">Vanilla JS • LocalStorage • Filters • Edit</p>
    </header>

    <section class="controls">
      <form id="taskForm" class="form" autocomplete="off">
        <input id="taskInput" type="text" placeholder="Add a new task..." />
        <button type="submit">Add</button>
      </form>

      <div class="filters" role="group" aria-label="Filters">
        <button class="filter is-active" data-filter="all">All</button>
        <button class="filter" data-filter="active">Active</button>
        <button class="filter" data-filter="completed">Completed</button>
      </div>
    </section>

    <section class="content">
      <ul id="taskList" class="list"></ul>

      <footer class="footer">
        <span id="itemsLeft">0 items left</span>
        <button id="clearCompleted" class="link" type="button">Clear completed</button>
      </footer>
    </section>
  </main>

  <script src="script.js"></script>
</body>
</html>
